<text class="axis" x="76" y="218.7" text-anchor="end">80</text>
<line x1="88" y1="146.3" x2="1028" y2="146.3" stroke="#e5e7eb" stroke-width="1"/>
<text class="axis" x="76" y="150.3" text-anchor="end">100</text>
<line x1="88" y1="78.0" x2="1028" y2="78.0" stroke="#e5e7eb" stroke-width="1"/>
