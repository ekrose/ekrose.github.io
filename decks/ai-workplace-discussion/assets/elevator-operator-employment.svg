<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">Elevator operator employment, 1870-1990</title>
<desc id="desc">Line chart showing total U.S. elevator operator employment from 1870 through 1990, rising to 114,473 in 1950 before falling to roughly 56,000 in 1960, 28,000 in 1970, 15,000 in 1980, and essentially zero by 1990.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;fill:#1f2933}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#556171}.axis{font-size:14px;fill:#374151}.source{font-size:12px;fill:#4b5563}.label{font-size:14px;font-weight:700;fill:#245c75}.annotation{font-size:13px;fill:#374151}.value{font-size:13px;font-weight:700;fill:#245c75}</style>
<text class="title" x="88" y="42">Elevator operator employment rose, then fell</text>
<text class="subtitle" x="88" y="66">U.S. elevator operators, selected census years</text>
<line x1="88" y1="488.0" x2="1028" y2="488.0" stroke="#e5e7eb" stroke-width="1"/>
<text class="axis" x="76" y="492.0" text-anchor="end">0</text>
