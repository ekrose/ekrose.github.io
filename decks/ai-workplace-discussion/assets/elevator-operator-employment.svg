<line x1="88.0" y1="488" x2="88.0" y2="495" stroke="#4b5563" stroke-width="1"/>
<text class="axis" x="88.0" y="516" text-anchor="middle">1870</text>
<line x1="323.0" y1="488" x2="323.0" y2="495" stroke="#4b5563" stroke-width="1"/>
<text class="axis" x="323.0" y="516" text-anchor="middle">1900</text>
